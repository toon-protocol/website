<!doctype html>
<!-- The social preview card. Render to toon-card.png, 1200 by 630:
     chromium --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=assets/og/toon-card.png assets/og/card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family:"Archivo"; font-weight:800; src:url("../fonts/archivo-800.woff2") format("woff2"); }
@font-face { font-family:"JetBrains Mono"; font-weight:100 800; src:url("../fonts/jetbrains-mono.woff2") format("woff2"); }
html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:#1c1f24; }
.card { position:relative; box-sizing:border-box; width:1200px; height:630px; padding:72px 80px; display:flex; flex-direction:column; }
.brand { display:flex; align-items:center; gap:14px; font:700 26px/1 "JetBrains Mono", monospace; color:#f3efe6; letter-spacing:0.02em; }
.brand small { font-weight:400; color:#878d97; margin-left:4px; }
.brand svg { width:44px; height:44px; }
.brand .c { fill:#878d97; } .brand .a { fill:#f3efe6; } .brand .b { fill:#c9a24a; } .brand .hole { fill:#1c1f24; }
.eyebrow { display:flex; align-items:center; gap:16px; margin-top:auto; font:600 19px/1 "JetBrains Mono", monospace; letter-spacing:0.16em; text-transform:uppercase; color:#878d97; }
.eyebrow::before { content:""; width:44px; height:2px; background:#c9a24a; }
h1 { margin:26px 0 0; font:800 104px/0.93 "Archivo", sans-serif; letter-spacing:-0.03em; color:#f3efe6; position:relative; }
h1 span { display:block; color:#d9b65c; }
.url { margin-top:34px; font:500 22px/1 "JetBrains Mono", monospace; color:#b6bbc4; letter-spacing:0.02em; }
.bigmark { position:absolute; right:-30px; top:-46px; width:380px; height:380px; }
.bigmark rect { fill:none; stroke:#f3efe6; stroke-width:5; opacity:0.16; }
.bigmark .b { fill:#c9a24a; fill-opacity:0.35; stroke:#c9a24a; opacity:0.5; }
.edge { position:absolute; inset:0; border-top:6px solid #c9a24a; pointer-events:none; }
</style>
</head>
<body>
<div class="card">
  <svg class="bigmark" viewBox="0 0 1024 1024" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><g><rect x="112" y="484" width="56" height="56"/><rect x="168" y="499" width="120" height="26"/><rect x="736" y="499" width="120" height="26"/><rect x="856" y="484" width="56" height="56"/></g><rect x="288" y="252" width="212" height="536"/><rect x="324" y="292" width="64" height="64"/><rect class="b" x="524" y="252" width="212" height="536"/></svg>
  <div class="brand"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><g class="c"><rect x="112" y="484" width="56" height="56"/><rect x="168" y="499" width="120" height="26"/><rect x="736" y="499" width="120" height="26"/><rect x="856" y="484" width="56" height="56"/></g><rect class="a" x="288" y="252" width="212" height="536"/><rect class="hole" x="324" y="292" width="64" height="64"/><rect class="b" x="524" y="252" width="212" height="536"/></svg>TOON<small>Protocol</small></div>
  <p class="eyebrow">Hidden services · paid per request</p>
  <h1>Host it from home. <span>Get paid by anyone.</span></h1>
  <p class="url">toon.ar.io</p>
  <div class="edge"></div>
</div>
</body>
</html>
