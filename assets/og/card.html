<!doctype html>
<!-- The social preview card: the full mark on Paper and the tagline in Ink, nothing else.
     Render to toon-card.png, 1200 by 630, from the repository root with a headless Chromium (Playwright's chrome-headless-shell works too):
     chromium --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=assets/og/toon-card.png "file://$PWD/assets/og/card.html" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family:"IBM Plex Sans Condensed"; font-weight:700; src:url("../fonts/ibm-plex-sans-condensed-700.woff2") format("woff2"); }
html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:#f3efe6; }
.card { box-sizing:border-box; width:1200px; height:630px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; }
svg { width:388px; height:260px; display:block; }
.w { fill:#6b6f76; } .m { fill:#2b2f36; } .hole { fill:#f3efe6; } .v { fill:#c9a24a; }
h1 { margin:0; white-space:nowrap; text-align:center; font:700 76px/1 "IBM Plex Sans Condensed", sans-serif; letter-spacing:-0.01em; color:#2b2f36; }
</style>
</head>
<body>
<div class="card">
  <svg viewBox="112 252 800 536" role="img" aria-label="TOON" xmlns="http://www.w3.org/2000/svg"><g class="w"><rect x="112" y="484" width="56" height="56"/><rect x="168" y="499" width="120" height="26"/><rect x="736" y="499" width="120" height="26"/><rect x="856" y="484" width="56" height="56"/></g><rect class="m" x="288" y="252" width="212" height="536"/><rect class="hole" x="324" y="292" width="64" height="64"/><rect class="v" x="524" y="252" width="212" height="536"/></svg>
  <h1>Your machine. Paid per request.</h1>
</div>
</body>
</html>
